# Release notes for GitHub releases, rendered by `just changelog` and the publish workflow
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
{% if version and previous.version %}\
    **Full Changelog**: https://github.com/kristoferssolo/sqrub/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
# Drops merge commits, whose subjects are PR titles without a type prefix
filter_unconventional = true
# Groups render in the order of their first parser
commit_parsers = [
    { message = "^build: release", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other" },
]
topo_order_commits = true
sort_commits = "oldest"
